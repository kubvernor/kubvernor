name: Docker Image CI

on:
  push:
   branches: [ "main" ]
   # tags: ["2.0.0"]
    
env:
  IMAGE_NAME: kubvernor
  
jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:    
    - uses: actions/checkout@v5
    - name: Set version
      run: |
        KUBVERNOR_VERSION=$(grep -m 1 '^version' "$CARGO_FILE" | sed 's/version\s*=\s*"\(.*\)"/\1/')
        
    - name: Build the Docker image
      run: docker build . --file docker/Dockerfile --tag $IMAGE_NAME:latest
    - name: Log in to registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Push image
      run: |
        IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME
        docker tag $IMAGE_NAME:latest $IMAGE_ID:$KUBVERNOR_VERSION
        docker push $IMAGE_ID:$KUBVERNOR_VERSION


