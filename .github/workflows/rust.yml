name: Kubvernor(fmt, test, release)
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update 
          sudo apt install protobuf-compiler -y
          rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
      - run: |
          echo $GITHUB_WORKSPACE
          KUBVERNOR_VERSION=$(grep -m 1 '^version' Cargo.toml | sed 's/version\s*=\s*"\(.*\)"/\1/')
          echo "KUBVERNOR_VERSION=$KUBVERNOR_VERSION" >> $GITHUB_ENV
      - uses: actions/checkout@v6
      - name: Check format
        run: cargo +nightly fmt --check
      - name: Test
        run: cargo test --all-features
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: kubvernor
          path: ${{ github.workspace }}/target/release/kubvernor
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          prerelease: true
          draft: false
          files: |
            ${{ github.workspace }}/releases/$KUBVERNOR_VERSION
            ${{ github.workspace }}/target/release/kubvernor
